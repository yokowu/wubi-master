[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
axum = "0.8.9"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "json", "chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tower-http = { version = "0.6.11", features = ["cors"] }
dotenvy = "0.15.7"
chrono = { version = "0.4.44", features = ["serde"] }
